<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ingresar · La Cablera</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf3f6;font:15px system-ui,Arial;color:#193849}
main{width:min(430px,94vw);padding:30px;background:white;border-radius:16px;box-shadow:0 12px 45px #19384924}
h1{margin:0 0 8px;color:#245a6b}p{color:#5a7180}label{display:block;margin:18px 0 6px;font-weight:600}
input{display:block;width:100%;padding:12px;border:1px solid #b9cbd4;border-radius:8px;margin-top:5px}
button{background:#146c79;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;width:100%;margin-top:20px}
#error{color:#b42318;min-height:20px}</style></head><body>
<main><h1>La Cablera</h1><p>Acceso a tus aplicaciones</p>
<form id="login"><label>Correo<input id="email" type="email" autocomplete="username" required></label>
<label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label>
<button type="submit">Ingresar</button></form><p id="error" role="alert"></p></main>
<script>
(()=>{'use strict';const key='lacablera_central_token_v1';
const destino=new URLSearchParams(location.search).get('volver')||'/';
function seguro(url){try{const u=new URL(url,location.origin);return u.origin===location.origin?u.pathname+u.search+u.hash:'/'}catch{return '/'}}
const volver=seguro(destino);
async function validar(token){const r=await fetch('/api/v1/central-auth/session.php',{headers:{Authorization:'Bearer '+token},cache:'no-store'});const d=await r.json();return r.ok&&d.ok;}
(async()=>{const token=localStorage.getItem(key);if(token){try{if(await validar(token)){location.replace(volver);return}}catch{}localStorage.removeItem(key)}})();
document.getElementById('login').addEventListener('submit',async e=>{
e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;
try{const r=await fetch('/api/v1/central-auth/login.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});
const d=await r.json();if(!r.ok||!d.ok||!d.data?.token)throw Error(typeof d.error==='object'?d.error.message:(d.error||'No se pudo ingresar'));
localStorage.setItem(key,d.data.token);document.getElementById('password').value='';location.replace(volver);
}catch(err){document.getElementById('error').textContent=err.message;b.disabled=false}});
})();
</script></body></html>
