<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>document.documentElement.classList.add('lcm-auth-booting');</script>
  <title>Inicio | La Cablera Marplatense</title>
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/brand.css">
  <link rel="stylesheet" href="/assets/css/atlantica.css?v=7">
  <link rel="stylesheet" href="/assets/css/global-shell.css?v=ux-20261002-1">
</head>
<body class="lcm-page--with-nav">
  <div class="lcm-global-backdrop" id="lcm-global-backdrop" hidden></div>
  <div class="lcm-shell-layout">
    <aside class="lcm-global-sidebar" id="lcm-global-sidebar" aria-label="Navegación principal"></aside>
    <main class="lcm-main">
      <header class="lcm-global-header" id="lcm-global-header"></header>
      <div class="lcm-content">
        <div class="lcm-global-status" id="lcm-global-status"><section class="lcm-global-status-card"><h2>Cargando sesión</h2><p>Estamos validando tu acceso corporativo.</p></section></div>
        <section id="lcm-home-workspace" class="lcm-workspace lcm-home-workspace" aria-live="polite">
          <div class="lcm-home-hero"><p class="lcm-eyebrow">La Cablera Marplatense</p><h1 id="lcm-home-greeting">Hola</h1><p>Elegí una herramienta para comenzar a trabajar.</p></div>
          <label class="lcm-home-search"><span class="sr-only">Buscar aplicaciones</span><span aria-hidden="true">⌕</span><input id="lcm-home-search-input" type="search" placeholder="Buscar aplicaciones…" autocomplete="off"></label>
          <div id="lcm-home-apps" class="lcm-app-grid"></div>
        </section>
        <section id="lcm-app-workspace" class="lcm-workspace lcm-app-workspace" hidden>
          <div class="lcm-app-loading" id="lcm-app-loading" hidden><span class="lcm-spinner" aria-hidden="true"></span><span>Cargando aplicación…</span></div>
          <div class="lcm-app-error" id="lcm-app-error" hidden><h2>No se pudo cargar la aplicación</h2><p>Intentá nuevamente o elegí otra aplicación del menú.</p><button type="button" data-lcm-action="retry-app">Reintentar</button></div>
          <iframe id="lcm-app-frame" title="Aplicación La Cablera" loading="eager" hidden></iframe>
        </section>
      </div>
    </main>
  </div>
  <script type="module" src="/assets/js/global-auth.js?v=ux-20261002-2"></script>
</body>
</html>
